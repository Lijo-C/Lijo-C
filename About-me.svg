    <text x="40" y="60" font-size="34" font-weight="bold" style="white-space: pre;">Hi 👋, I'm Lijo Chacko</text>
    <text x="40" y="100" font-size="20" font-weight="600" fill="#13A89E" style="white-space: pre;">Bridging 23+ Years of Architectural Design with Data Science &amp; AI</text>
