  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" transform="matrix(1.014184, 0, 0, 1, 37.458801, -2.364246)" style="">
    <text x="40" y="52" font-size="34" font-weight="bold" style="white-space: pre; font-size: 34px;">Hi 👋, I'm Lijo Chacko</text>
    <text x="46.25" y="96.125" font-size="20" font-weight="600" fill="#13A89E" style="white-space: pre; font-size: 20px;">From structural spaces to neural networks bridging 23+ years of physical design</text>
    <text x="72.181" y="156.931" font-weight="bold" fill="#13A89E" style="white-space: pre; font-size: 16px;">🌍 International Design Background:</text>
    <text x="40" y="175" style="white-space: pre;" transform="matrix(1.124318, 0, 0, 1, 84.349067, 12.15706)">Over two decades of experience in architectural, interior, and product design,</text>
    <text x="40" y="200" style="white-space: pre;" transform="matrix(1.124318, 0, 0, 1, 84.349067, 12.15706)">spanning projects across India, the UAE, Saudi Arabia, and Syria.</text>
    <text x="72.181" y="251.931" font-weight="bold" fill="#13A89E" style="white-space: pre; font-size: 16px;">🎓 Advanced Analytics &amp; AI:</text>
    <text x="40" y="270" style="white-space: pre;" transform="matrix(1.124318, 0, 0, 1, 84.349067, 12.15706)">Holding an M.Sc. in Data Science, AI &amp; Digital Business. My recent Master's</text>
    <text x="40" y="295" style="white-space: pre;" transform="matrix(1.124318, 0, 0, 1, 84.349067, 12.15706)">thesis focused on utilizing deep learning networks for industrial fault detection.</text>
    <text x="72.181" y="346.931" font-weight="bold" fill="#13A89E" style="white-space: pre; font-size: 16px;">💻 Technical Focus:</text>
    <text x="40" y="365" style="white-space: pre;" transform="matrix(1.124318, 0, 0, 1, 84.349067, 12.15706)">Translating physical spatial design into dynamic digital experiences using Python,</text>
    <text x="40" y="390" style="white-space: pre;" transform="matrix(1.124318, 0, 0, 1, 84.349067, 12.15706)">React, Firebase, and advanced 3D web rendering tools like Three.js and WebGL.</text>
    <text x="46.747" y="119.488" font-size="20" font-weight="600" fill="#13A89E" style="white-space: pre; font-size: 20px; stroke-width: 1;">craftsmanship with modern full-stack engineering, 3D web rendering, and AI.</text>
